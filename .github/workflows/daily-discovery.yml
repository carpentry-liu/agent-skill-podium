name: Daily competition discovery

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-competition-discovery
  cancel-in-progress: true

jobs:
  discover:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover, write unverified leads, and verify repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/maintain.py discover --write-leads
      - name: Commit changed leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json data/discovery.js
          if git diff --cached --quiet; then
            echo "No discovery changes"
            exit 0
          fi
          git commit -m "chore(data): refresh daily discovery leads"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refreshed discovery feed
        id: deployment
        uses: actions/deploy-pages@v4
